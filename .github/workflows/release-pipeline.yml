            echo "::notice::net8.0-maccatalyst 揶쎛 TargetFrameworks ????곷선 macOS ??슢諭띄몴???쎄땁??몃빍??Graceful ??野껉퀣苑?? PromptFlowStudio.Mobile.csproj + Platforms/MacCatalyst ??쇳떐??逾??곕떽? ???癒?짗 ??뽮쉐)."
