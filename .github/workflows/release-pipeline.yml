on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ???? ??Windows ?怨쀫뮞???? net8.0-windows ?癒?퍥?袁㏐퍙 ??μ뵬???뵬 Release ????????????????????????????????????????????????????????
  windows-desktop:
    name: Windows (net8.0-windows 夷?self-contained 夷?warn=error)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore PromptFlowStudio/PromptFlowStudio.csproj

      - name: Build (Release 夷?0 野껋럡??0 ??살첒 揶쏅벡??
        run: dotnet build PromptFlowStudio/PromptFlowStudio.csproj -c Release --no-restore -warnaserror

      - name: xUnit ???(100% PASS 夷?筌욊낮??
        run: dotnet test PromptFlowStudio.Tests/PromptFlowStudio.Tests.csproj -c Release -warnaserror --logger "trx;LogFileName=test_results.trx" --results-directory TestResults -- RunConfiguration.MaxCpuCount=1 RunConfiguration.DisableParallelization=true

      - name: TRX ??낆쨮??
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Publish (win-x64 self-contained single file)
        run: |
          dotnet publish PromptFlowStudio/PromptFlowStudio.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o artifacts/windows

      - name: SHA-256 筌ｋ똾寃????밴쉐
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          Get-ChildItem artifacts/windows -File | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_.Name)" | Add-Content artifacts/windows/CHECKSUMS.sha256
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptflow-windows-x64
          path: artifacts/windows/**
          if-no-files-found: error

  # ???? ??Android: net8.0-android Release ??슢諭??뚮똾???野껊슣??? + ??고닜?귐딅뻻 ?怨쀭뀱??筌ｋ똾寃??????????????????????
  android:
    name: Android (net8.0-android 夷?warn=error)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup JDK 17 (Microsoft OpenJDK 夷?MAUI Android ?遺쎈럡)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore PromptFlowStudio.Mobile/PromptFlowStudio.Mobile.csproj

      - name: Build (net8.0-android 夷?Release 夷?0 野껋럡??0 ??살첒 揶쏅벡??
        run: dotnet build PromptFlowStudio.Mobile/PromptFlowStudio.Mobile.csproj -f net8.0-android -c Release --no-restore -warnaserror

      - name: Publish (unsigned APK/AAB 夷?CI 野꺜筌앹빘??
        run: |
          dotnet publish PromptFlowStudio.Mobile/PromptFlowStudio.Mobile.csproj -f net8.0-android -c Release `
            -o artifacts/android

      - name: SHA-256 筌ｋ똾寃????밴쉐
        shell: bash
        run: |
          mkdir -p artifacts/android
          cd artifacts/android
          find . -maxdepth 1 -type f \( -iname '*.apk' -o -iname '*.aab' \) -exec sha256sum {} \; > CHECKSUMS.sha256 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: promptflow-android
          path: artifacts/android/**
          if-no-files-found: warn

  # ???? ??iOS: net8.0-ios ?????됱뵠???????뚮똾???野껊슣?????뺤구 ?븍뜇釉??夷???쎈꽅????뺤구 獄쏄퀬猷??store-deploy.yml ?袁⑤뼖) ????
