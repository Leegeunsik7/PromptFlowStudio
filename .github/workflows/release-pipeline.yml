  macos-maccatalyst:
    name: macOS (Mac Catalyst 夷?conditional)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: TargetFrameworks ?類ㅼ뵥 ??net8.0-maccatalyst ?봔????Graceful ??쎄땁
        id: check
