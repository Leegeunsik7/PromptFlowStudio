name: Store Deploy (Android AAB + iOS IPA)

# PromptFlow Studio v4.4.0 — 무인 CI/CD: 빌드 → C# 실파일 검수(CiCdPipelineRunner) → 통과 시 스토어 자동 릴리스.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*.*.*' ]

env:
  DOTNET_VERSION: '8.0.x'
  APP_VERSION: '4.4.0'

jobs:
  android:
    name: Android AAB → Google Play
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Install MAUI (android)
        run: dotnet workload install maui-android
      - name: Restore keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/pf.keystore"
      - name: Build signed AAB
        run: >
          dotnet publish PromptFlowStudio.Mobile/PromptFlowStudio.Mobile.csproj
          -f net8.0-android -c Release -p:AndroidPackageFormat=aab
          -p:ApplicationDisplayVersion=${{ env.APP_VERSION }}
          -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/pf.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_STORE_PASS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASS }}
      - name: '🚦 CI Gate — 16KB 정렬/서명 실검수(결함 시 Exit 1)'
        run: |
          AAB=$(find . -name '*-Signed.aab' | head -1)
          dotnet run --project tools/PromptFlowCiGate -c Release -- --aab "$AAB" --min-score 90
      - name: Release to Google Play (검수 통과 시)
        if: success()
        run: >
          dotnet run --project tools/PromptFlowCiGate -c Release --
          --upload-aab "$(find . -name '*-Signed.aab' | head -1)"
          --google-sa "${{ secrets.GOOGLE_SA_JSON }}" --package com.angtec.promptflowstudio --track internal

  ios:
    name: iOS IPA → App Store Connect / TestFlight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Install MAUI (ios)
        run: dotnet workload install maui-ios
      - name: Import signing (cert + profile)
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          echo "$P12_B64" | base64 -d > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_B64" | base64 -d > $RUNNER_TEMP/pf.mobileprovision
      - name: Build signed IPA
        run: >
          dotnet publish PromptFlowStudio.Mobile/PromptFlowStudio.Mobile.csproj
          -f net8.0-ios -c Release -p:ApplicationDisplayVersion=${{ env.APP_VERSION }}
          -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="${{ secrets.IOS_SIGNING_IDENTITY }}"
          -p:CodesignProvision="PromptFlow Dist"
      - name: '🚦 CI Gate — PrivacyManifest/Required Reason/프로파일 실검수(결함 시 Exit 1)'
        run: |
          IPA=$(find . -name '*.ipa' | head -1)
          dotnet run --project tools/PromptFlowCiGate -c Release -- --ipa "$IPA" --min-score 90
      - name: Upload to TestFlight (검수 통과 시 · ES256 JWT)
        if: success()
        run: >
          dotnet run --project tools/PromptFlowCiGate -c Release --
          --upload-ipa "$(find . -name '*.ipa' | head -1)"
          --asc-key-id ${{ secrets.ASC_KEY_ID }} --asc-issuer ${{ secrets.ASC_ISSUER_ID }} --asc-key "${{ secrets.ASC_PRIVATE_KEY }}"
