name: Release

# v* 태그(예: v1.0.1) 푸시 시 자동 릴리스.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # GitHub Release 생성/자산 업로드에 필요

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')   # v1.0.1 -> 1.0.1
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version = $ver"

      # ── FFmpeg 동봉: 정적 win64 빌드를 받아 프로젝트 루트에 두면 csproj Target 이 publish 로 복사 ──
      #    ⚠ 재배포 라이선스(GPL) 확인 필요. 사내/개인 배포 기준.
      - name: Download FFmpeg (bundle)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName "${{ github.workspace }}\ffmpeg.exe" -Force
          Write-Host "FFmpeg -> $($exe.FullName)"

      # ── 단일 파일 · 자체 포함 · 트리밍 금지 · 버전 스탬프(태그와 일치) ──
      - name: Publish (self-contained single file)
        shell: pwsh
        run: |
          dotnet publish PromptFlowStudio.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -p:AssemblyVersion=${{ steps.ver.outputs.version }}.0 `
            -p:FileVersion=${{ steps.ver.outputs.version }}.0

      # ── (선택) 앱 EXE 코드 서명 — 향후 인증서 구매 시 주석 해제 ──
      # - name: Sign app exe
      #   shell: pwsh
      #   run: |
      #     $pfx = "$env:RUNNER_TEMP\cert.pfx"
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.CODE_SIGN_PFX_BASE64 }}"))
      #     & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
      #       /f $pfx /p "${{ secrets.CODE_SIGN_PFX_PASSWORD }}" /fd SHA256 `
      #       /tr http://timestamp.digicert.com /td SHA256 `
      #       "bin\Release\net8.0-windows\win-x64\publish\PromptFlowStudio.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\PromptFlowStudio.iss" "/DMyAppVersion=${{ steps.ver.outputs.version }}"

      # ── (선택) 인스톨러(Setup.exe) 코드 서명 — 위와 동일 방식으로 주석 해제 ──
      # - name: Sign installer
      #   shell: pwsh
      #   run: |
      #     & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
      #       /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.CODE_SIGN_PFX_PASSWORD }}" /fd SHA256 `
      #       /tr http://timestamp.digicert.com /td SHA256 `
      #       "installer\Output\PromptFlow Studio Setup.exe"

      - name: Create GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: PromptFlow Studio ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # 릴리스 설명(body) = RELEASE_NOTES.md → 앱 내 릴리스 노트 모달이 이 내용을 렌더한다.
          # 파일이 없으면 자동 생성 노트로 폴백. (버전마다 RELEASE_NOTES.md 를 갱신하세요.)
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: 'installer/Output/PromptFlow Studio Setup.exe'
