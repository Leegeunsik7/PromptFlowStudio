<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptFlow Studio · 프롬프트→영상 생성 워크플로우</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- ══════════════════════════════════════════════════════════════════
         ⚠ 스타일시트를 <캐시 무효화 쿼리>와 함께 붙인다.

         BlazorWebView 는 정적 자산을 가상 호스트로 서빙하고, WebView2 는
         그 응답을 사용자 데이터 폴더에 캐시한다. 이 캐시는 앱을 껐다 켜도
         남는다 — 그래서 CSS 를 고쳐도 화면이 그대로인 일이 실제로 반복됐다.
         쿼리에 실행 시각을 붙이면 매 기동마다 새 URL 이 되어 캐시를 건너뛴다.
         ⚠ 이 스크립트는 <link 태그보다 먼저> 와야 한다.
         ══════════════════════════════════════════════════════════════════ -->
    <script>
        (function () {
            var v = Date.now().toString(36);
            var files = ["app.css", "modules.css", "site-ui-advanced.css", "broadcast-studio.css", "_pfs/hud-theme.css", "_pfs/PromptFlowStudio.Shared.bundle.scp.css"];
            for (var i = 0; i < files.length; i++) {
                var l = document.createElement("link");
                l.rel = "stylesheet";
                l.href = files[i] + "?v=" + v;
                document.head.appendChild(l);
            }
        })();
    </script>
    <noscript>
        <link rel="stylesheet" href="app.css" />
        <link rel="stylesheet" href="modules.css" />
        <link rel="stylesheet" href="site-ui-advanced.css" />
        <link rel="stylesheet" href="broadcast-studio.css" />
        <link rel="stylesheet" href="_pfs/hud-theme.css" />
        <link rel="stylesheet" href="_pfs/PromptFlowStudio.Shared.bundle.scp.css" />
    </noscript>
</head>
<body>
    <div id="app">
        <div class="boot">PromptFlow Studio 로딩 중…</div>
    </div>
    <div id="blazor-error-ui">
        오류가 발생했습니다.
        <a href="" class="reload">새로고침</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="promptflow.js"></script>
    <script src="audio-analyzer.js"></script>
    <script src="playhead-sync.js"></script>
    <script src="voice-director.js"></script>
    <script src="webxr-bridge.js"></script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
